version: 2
updates:
  # Gradle dependencies (libs.versions.toml)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      androidx:
        patterns:
          - "androidx.*"
      compose:
        patterns:
          - "org.jetbrains.compose*"
      grpc:
        patterns:
          - "io.grpc*"
          - "com.squareup.wire*"
    ignore:
      # Pinned to 3.4.1. 3.5.x bytecode calls putArchiveEntry(TarArchiveEntry), which
      # only exists in commons-compress 1.26+.
      # See build.gradle.kts comments + https://github.com/GoogleContainerTools/jib/issues/4235
      # PR #1133 bumped past this constraint and broke build_server on main.
      # NOTE: commons-compress moved to 1.28.0 in PR #1424, so the 1.26+ requirement is
      # now met and this pin is unblocked on that axis. Unpinning still needs the three
      # force()/classpath entries in build.gradle.kts changed together, plus a
      # :server:app:jibBuildTar run — a catalog-only bump is overridden (PR #1426).
      - dependency-name: "com.google.cloud.tools:jib-gradle-plugin"
      # Same pin, plugins-DSL marker form. Dependabot treats the plugin id used in
      # libs.versions.toml as a distinct dependency from the artifact above, so it
      # kept re-proposing the bump the artifact ignore blocks (PR #1248).
      - dependency-name: "com.google.cloud.tools.jib:com.google.cloud.tools.jib.gradle.plugin"
      # Pinned to 2.10.0-beta01 — 2.11.0-beta01 DROPPED the iosX64 target, so every
      # org.jetbrains.androidx.lifecycle:* artifact fails K/N resolution
      # ("Couldn't resolve dependency ... Unresolved platforms: [iosX64]") and breaks
      # build_ios_compose / build_ios_native / validation_ios_ui. PR #1225 bumped to
      # 2.11.0-beta01 and broke main; reverted in PR #1239. It passed PR CI because
      # dev-mode skips iOS jobs on PRs — the break only surfaced post-merge.
      # Revisit when upstream restores iosX64 (or we deliberately drop the iosX64 target).
      - dependency-name: "org.jetbrains.androidx.lifecycle:*"
      # ───────────────────────────────────────────────────────────────────────
      # TEMPORARY ignores — version-scoped so unrelated updates still flow.
      # Each unblocks externally; DELETE its entry (and these comments) once the
      # upstream blocker clears, then let Dependabot re-propose the upgrade.
      # ───────────────────────────────────────────────────────────────────────
      # Kotlin >= 2.3.10 blocked: SKIE 0.10.9 only supports up to Kotlin 2.3.0.
      # 2.4.0 fails loudly ("SKIE 0.10.9 does not support Kotlin 2.4.0", PR #1222).
      # 2.3.10 fails SUBTLY: the framework builds, but SKIE's exported Swift API
      # changes shape — identical Swift test sources that compile on main fail with
      # "missing argument for parameter 'imageEtag' in call" (TestData.swift), caught
      # by a release-mode CI dispatch on PR #1244's branch before merge (2026-07-25).
      # Only the kotlin compiler/plugin artifacts are pinned; the kotlinx-* group
      # (coroutines/datetime/serialization) stays free to update.
      # REMOVE when SKIE supports the desired Kotlin version (see bb-kotlin-skie-upgrade
      # in TODO.md — bump SKIE and Kotlin together, verified via release-mode CI).
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [">= 2.3.10"]
      # Same pin, plugins-DSL marker form: the TOML `kotlin` version key drives plugin
      # markers in groups like org.jetbrains.kotlin.multiplatform, which the colon-anchored
      # glob above does not match — PR #1402 bumped kotlin to 2.4.10 minutes after the
      # artifact pin landed. The trailing-dot glob matches every org.jetbrains.kotlin.<x>
      # marker group while leaving org.jetbrains.kotlinx* free (kotlinx has no dot).
      - dependency-name: "org.jetbrains.kotlin.*"
        versions: [">= 2.3.10"]
      # gRPC >= 1.79 blocked: the generated gRPC stubs call codegen APIs removed in
      # 1.79 (BlockingClientCall, blockingV2UnaryCall, ...), producing 5 compile
      # errors in server/app. Dependabot PR #1223 (grpc group → grpcJava 1.81, wire
      # 6.4) could not compile. grpc-kotlin (< 1.79) stays free.
      # REMOVE after regenerating protos with a matching codegen plugin.
      #
      # Wire is NOT ignored: #1223 failed on the gRPC half only, and Wire generates
      # its own client rather than server/app's *Grpc.java. Unpinned in PR #1414
      # after verifying 6.4.5 compiles on desktop/android/iosArm64 + e2e-tests.
      - dependency-name: "io.grpc:*"
        versions: [">= 1.79.0"]
      # Exposed >= 1.0 blocked: 1.x relocated its packages, so
      # `org.jetbrains.exposed.sql.javatime.timestamp` (PostgresDeviceRepository.kt:14)
      # stops resolving and every downstream `toKotlinInstant()` fails on receiver type.
      # PR #1425 (0.50.1 → 1.3.1) could not compile :server:app.
      # REMOVE after migrating the server repository layer — see bb-exposed-1x in TODO.md.
      - dependency-name: "org.jetbrains.exposed:*"
        versions: [">= 1.0.0"]
      # KSP >= 2.3 blocked: KSP is versioned <kotlin>-<ksp> and must match the Kotlin
      # version, which is itself capped at 2.3.0 by the SKIE pin above. PR #1428
      # (2.2.20-2.0.4 → 2.3.10) failed at configuration time with "Could not find the
      # Android Gradle Plugin (AGP) extension"; reverting only ksp made the same build pass.
      # REMOVE together with the Kotlin/SKIE upgrade — KSP cannot move independently.
      - dependency-name: "com.google.devtools.ksp"
        versions: [">= 2.3.0"]
      # Same pin, plugins-DSL marker form (see the kotlin/jib marker entries above).
      - dependency-name: "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin"
        versions: [">= 2.3.0"]
      # ───────────────────────────────────────────────────────────────────────
    labels:
      - "dependencies"
      - "automated"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "automated"
