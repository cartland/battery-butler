version: 2
updates:
  # Gradle dependencies (libs.versions.toml)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      androidx:
        patterns:
          - "androidx.*"
      compose:
        patterns:
          - "org.jetbrains.compose*"
      grpc:
        patterns:
          - "io.grpc*"
          - "com.squareup.wire*"
    ignore:
      # Pinned to 3.4.1 — last version compatible with commons-compress 1.21.
      # 3.5.x bytecode calls putArchiveEntry(TarArchiveEntry) which only exists
      # in commons-compress 1.26+, but our resolution forces 1.21 for Ktor compat.
      # See build.gradle.kts comments + https://github.com/GoogleContainerTools/jib/issues/4235
      # PR #1133 bumped past this constraint and broke build_server on main.
      - dependency-name: "com.google.cloud.tools:jib-gradle-plugin"
      # Pinned to 2.10.0-beta01 — 2.11.0-beta01 DROPPED the iosX64 target, so every
      # org.jetbrains.androidx.lifecycle:* artifact fails K/N resolution
      # ("Couldn't resolve dependency ... Unresolved platforms: [iosX64]") and breaks
      # build_ios_compose / build_ios_native / validation_ios_ui. PR #1225 bumped to
      # 2.11.0-beta01 and broke main; reverted in PR #1239. It passed PR CI because
      # dev-mode skips iOS jobs on PRs — the break only surfaced post-merge.
      # Revisit when upstream restores iosX64 (or we deliberately drop the iosX64 target).
      - dependency-name: "org.jetbrains.androidx.lifecycle:*"
    labels:
      - "dependencies"
      - "automated"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "automated"
