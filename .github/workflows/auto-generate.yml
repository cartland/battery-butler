# =============================================================================
# AUTO-GENERATE CONTENT WORKFLOW
# =============================================================================
#
# PURPOSE:
#   Generates architecture diagrams, code share analysis, and screenshot
#   baselines on main, then creates follow-up PRs with any changes.
#
# DESIGN:
#   Workflows NEVER push commits to PR branches. This eliminates the entire
#   class of CI loop/blocking problems caused by the old update-diagrams.yml
#   and update-screenshots.yml workflows (see PRs #426, #428 for history).
#
#   Instead, generated content is updated post-merge on main via follow-up PRs
#   created with peter-evans/create-pull-request using GITHUB_TOKEN.
#
#   GITHUB_TOKEN pushes don't trigger workflows (GitHub's built-in loop
#   prevention), so ci-trigger-auto-prs.yml dispatches CI separately.
#
# =============================================================================

name: Auto-Generate Content

on:
  # Run after code merges to main
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.swift'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'compose-app/**'
      - 'presentation-*/**'
      - 'android-screenshot-tests/**'

  # Weekly refresh to catch any drift
  schedule:
    - cron: '0 6 * * 1'  # Monday at 6 AM UTC

  # Manual trigger for testing
  workflow_dispatch:

concurrency:
  group: auto-generate
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_PRODUCTION_SERVER_URL: ${{ secrets.PRODUCTION_SERVER_URL }}
  ORG_GRADLE_PROJECT_DEV_SERVER_URL: ${{ secrets.DEV_SERVER_URL }}
  ORG_GRADLE_PROJECT_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

jobs:
  # ===========================================================================
  # Job 1: Diagrams + Code Share Analysis
  # ===========================================================================
  diagrams-and-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-java-gradle

      - name: Generate Diagrams and Code Share Analysis
        run: ./gradlew generateMermaidGraph analyzeCodeShare

      - name: Validate Generated Files
        run: ./scripts/validate-generated.sh --diagrams --analysis

      - name: Check for meaningful changes
        id: check-changes
        run: |
          # Check if any diagram or analysis content files changed
          CONTENT_CHANGES=$(git diff --name-only -- '*.mmd' '*.svg' 'docs/Code_Share_Analysis.md' | wc -l | tr -d ' ')
          echo "content_changes=$CONTENT_CHANGES" >> $GITHUB_OUTPUT
          if [ "$CONTENT_CHANGES" -eq 0 ]; then
            echo "No diagram or analysis content changes detected — skipping PR creation"
          else
            echo "$CONTENT_CHANGES content file(s) changed"
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.content_changes != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(generated): Regenerate architecture diagrams and analysis"
          title: "docs(generated): Regenerate architecture diagrams and analysis"
          body: |
            Architecture diagrams and code share analysis regenerated to match current code.

            This PR was automatically created by the Auto-Generate Content workflow
            after a code change was merged to main.

            **Source commit:** ${{ github.sha }}
            **Triggered by:** ${{ github.event_name }}
          branch: auto/update-generated-content
          base: main
          delete-branch: true
          labels: automated

  # ===========================================================================
  # Job 2: Screenshot Baselines
  # ===========================================================================
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-java-gradle

      - name: Generate Screenshots Sequentially
        run: ./scripts/generate-android-screenshots.sh

      - name: Generate Screenshot Gallery
        run: ./scripts/generate-android-screenshot-gallery.sh

      - name: Validate Generated Files
        run: ./scripts/validate-generated.sh --screenshots

      - name: Check for meaningful changes
        id: check-changes
        run: |
          # Check if any .png or gallery files changed
          CHANGES=$(git diff --name-only -- '*.png' 'android-screenshot-tests/SCREENSHOT_GALLERY.md' | wc -l | tr -d ' ')
          echo "changes=$CHANGES" >> $GITHUB_OUTPUT
          if [ "$CHANGES" -eq 0 ]; then
            echo "No screenshot changes detected — skipping PR creation"
          else
            echo "$CHANGES file(s) changed"
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.changes != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(generated): Regenerate screenshots"
          title: "chore(generated): Regenerate screenshots"
          body: |
            Screenshots regenerated to match current UI.

            This PR was automatically created by the Auto-Generate Content workflow
            after a UI code change was merged to main.

            **Source commit:** ${{ github.sha }}
            **Triggered by:** ${{ github.event_name }}
          branch: auto/update-screenshots
          base: main
          delete-branch: true
          labels: automated

  # ===========================================================================
  # Job 3: iOS Snapshots + Gallery
  # ===========================================================================
  ios-snapshots:
    runs-on: macos-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-java-gradle

      - name: Record iOS Snapshots
        run: ./scripts/record-ios-snapshots.sh

      - name: Generate iOS Screenshot Gallery
        run: ./scripts/generate-ios-screenshot-gallery.sh

      - name: Check for meaningful changes
        id: check-changes
        run: |
          CHANGES=$(git diff --name-only -- 'ios-app-swift-ui/iosAppSwiftUITests/__Snapshots__/*.png' 'ios-app-swift-ui/SCREENSHOT_GALLERY.md' | wc -l | tr -d ' ')
          UNTRACKED=$(git ls-files --others --exclude-standard -- 'ios-app-swift-ui/iosAppSwiftUITests/__Snapshots__/*.png' | wc -l | tr -d ' ')
          TOTAL=$((CHANGES + UNTRACKED))
          echo "changes=$TOTAL" >> $GITHUB_OUTPUT
          if [ "$TOTAL" -eq 0 ]; then
            echo "No iOS snapshot changes detected — skipping PR creation"
          else
            echo "$TOTAL file(s) changed or added"
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.changes != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(generated): Regenerate iOS snapshots and gallery"
          title: "chore(generated): Regenerate iOS snapshots and gallery"
          body: |
            iOS snapshots recorded and gallery regenerated to match current UI.

            This PR was automatically created by the Auto-Generate Content workflow
            after a UI code change was merged to main.

            **Source commit:** ${{ github.sha }}
            **Triggered by:** ${{ github.event_name }}
          branch: auto/update-ios-screenshots
          base: main
          delete-branch: true
          labels: automated
