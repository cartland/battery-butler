# =============================================================================
# AUTO-GENERATE CONTENT WORKFLOW
# =============================================================================
#
# PURPOSE:
#   Generates architecture diagrams, code analysis, and screenshot
#   baselines on main, then creates follow-up PRs with any changes.
#
# DESIGN:
#   Workflows NEVER push commits to PR branches. This eliminates the entire
#   class of CI loop/blocking problems caused by the old update-diagrams.yml
#   and update-screenshots.yml workflows (see PRs #426, #428 for history).
#
#   Instead, generated content is updated post-merge on main via follow-up PRs
#   created with peter-evans/create-pull-request using GITHUB_TOKEN.
#
#   GITHUB_TOKEN pushes don't trigger workflows (GitHub's built-in loop
#   prevention), so each job closes/reopens the PR with BOT_PAT to trigger CI
#   inline. ci-trigger-auto-prs.yml remains as a fallback.
#
# =============================================================================

name: Auto-Generate Content

on:
  # Run after code merges to main
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.swift'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'compose-app/**'
      - 'presentation-*/**'
      - 'android-screenshot-tests/**'

  # Weekly refresh to catch any drift
  schedule:
    - cron: '0 6 * * 1'  # Monday at 6 AM UTC

  # Manual trigger for testing
  workflow_dispatch:

concurrency:
  group: auto-generate
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_PRODUCTION_SERVER_URL: ${{ secrets.PRODUCTION_SERVER_URL }}
  ORG_GRADLE_PROJECT_DEV_SERVER_URL: ${{ secrets.DEV_SERVER_URL }}
  ORG_GRADLE_PROJECT_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

jobs:
  # ===========================================================================
  # Job 1: Diagrams + Code Analysis
  # ===========================================================================
  diagrams-and-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java-gradle

      - name: Generate Diagrams and Code Analysis
        run: ./gradlew generateMermaidGraph analyzeCode

      - name: Validate Generated Files
        run: ./scripts/validate-generated.sh --diagrams --analysis

      - name: Check for meaningful changes
        id: check-changes
        run: |
          # Check if any diagram or analysis content files changed
          CONTENT_CHANGES=$(git diff --name-only -- '*.mmd' '*.svg' 'docs/CODE_ANALYSIS.md' 'README.md' | wc -l | tr -d ' ')
          echo "content_changes=$CONTENT_CHANGES" >> $GITHUB_OUTPUT
          if [ "$CONTENT_CHANGES" -eq 0 ]; then
            echo "No diagram or analysis content changes detected — skipping PR creation"
          else
            echo "$CONTENT_CHANGES content file(s) changed"
          fi

      - name: Create Pull Request
        id: create-pr-diagrams
        if: steps.check-changes.outputs.content_changes != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(generated): Regenerate architecture diagrams and analysis"
          title: "docs(generated): Regenerate architecture diagrams and analysis"
          body: |
            Architecture diagrams and code analysis regenerated to match current code.

            This PR was automatically created by the Auto-Generate Content workflow
            after a code change was merged to main.

            **Source commit:** ${{ github.sha }}
            **Triggered by:** ${{ github.event_name }}
          branch: auto/update-generated-content
          base: main
          delete-branch: true
          labels: automated

      - name: Trigger CI on PR
        if: steps.create-pr-diagrams.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        continue-on-error: true
        run: |
          PR_NUM="${{ steps.create-pr-diagrams.outputs.pull-request-number }}"
          echo "Triggering CI on PR #$PR_NUM by closing and reopening..."
          if ! gh pr close "$PR_NUM" 2>&1; then
            echo "::error::Failed to close PR #$PR_NUM via BOT_PAT — likely HTTP 401 Bad credentials (token expired/invalid). The PR was created but Battery Butler CI will NOT fire on it automatically. Workaround: 'gh pr close $PR_NUM && gh pr reopen $PR_NUM' from a session whose token is valid. Permanent fix: rotate the BOT_PAT secret in repo Settings → Secrets and variables → Actions (needs fine-grained Pull requests + Workflows read/write, or classic 'repo' + 'workflow' scopes). See the bb-16u1 task in TODO.md."
            exit 1
          fi
          gh pr reopen "$PR_NUM"
          echo "CI now triggered on PR #$PR_NUM"

  # ===========================================================================
  # Job 2: Android Screenshot Baselines
  # ===========================================================================
  android-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java-gradle

      - name: Generate Android Screenshots Sequentially
        run: ./scripts/generate-android-screenshots.sh

      - name: Generate Android Screenshot Gallery
        run: ./scripts/generate-android-screenshot-gallery.sh

      - name: Validate Generated Files
        run: ./scripts/validate-generated.sh --android-screenshots

      - name: Check for meaningful changes
        id: check-changes
        run: |
          # Only check PNG changes — gallery markdown has timestamps that change every run
          CHANGES=$(git diff --name-only -- '*.png' | wc -l | tr -d ' ')
          echo "changes=$CHANGES" >> $GITHUB_OUTPUT
          if [ "$CHANGES" -eq 0 ]; then
            echo "No Android screenshot changes detected — skipping PR creation"
          else
            echo "$CHANGES file(s) changed"
          fi

      - name: Create Pull Request
        id: create-pr-screenshots
        if: steps.check-changes.outputs.changes != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(generated): Regenerate Android screenshots"
          title: "chore(generated): Regenerate Android screenshots"
          body: |
            Android screenshots regenerated to match current UI.

            This PR was automatically created by the Auto-Generate Content workflow
            after a UI code change was merged to main.

            **Source commit:** ${{ github.sha }}
            **Triggered by:** ${{ github.event_name }}
          branch: auto/update-android-screenshots
          base: main
          delete-branch: true
          labels: automated

      - name: Trigger CI on PR
        if: steps.create-pr-screenshots.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        continue-on-error: true
        run: |
          PR_NUM="${{ steps.create-pr-screenshots.outputs.pull-request-number }}"
          echo "Triggering CI on PR #$PR_NUM by closing and reopening..."
          if ! gh pr close "$PR_NUM" 2>&1; then
            echo "::error::Failed to close PR #$PR_NUM via BOT_PAT — likely HTTP 401 Bad credentials (token expired/invalid). The PR was created but Battery Butler CI will NOT fire on it automatically. Workaround: 'gh pr close $PR_NUM && gh pr reopen $PR_NUM' from a session whose token is valid. Permanent fix: rotate the BOT_PAT secret in repo Settings → Secrets and variables → Actions (needs fine-grained Pull requests + Workflows read/write, or classic 'repo' + 'workflow' scopes). See the bb-16u1 task in TODO.md."
            exit 1
          fi
          gh pr reopen "$PR_NUM"
          echo "CI now triggered on PR #$PR_NUM"

  # ===========================================================================
  # Job 3: iOS Snapshots (Record + Gallery)
  # ===========================================================================
  ios-snapshots:
    runs-on: macos-latest
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin Xcode version for reproducible iOS snapshots.
          # Update this when changing local dev Xcode version.
          xcode-version: '26.3'

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ios-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ios-
            ${{ runner.os }}-gradle-

      - name: Record iOS Snapshots
        run: ./scripts/record-ios-snapshots.sh

      - name: Generate iOS Screenshot Gallery
        run: ./scripts/generate-ios-screenshot-gallery.sh

      - name: Check for changes
        id: check-changes
        run: |
          # Only check PNG changes — gallery markdown has timestamps that change every run
          PNG_CHANGES=$(git diff --name-only -- '*.png' | wc -l | tr -d ' ')
          NEW_PNGS=$(git ls-files --others --exclude-standard -- '*.png' | wc -l | tr -d ' ')
          TOTAL=$(( PNG_CHANGES + NEW_PNGS ))
          echo "total_changes=$TOTAL" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: create-pr-ios
        if: steps.check-changes.outputs.total_changes != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(generated): Update iOS snapshot references"
          title: "chore(generated): Update iOS snapshot references"
          body: |
            iOS snapshot references updated to match current code.

            This PR was automatically created by the Auto-Generate Content workflow.

            **Source commit:** ${{ github.sha }}
          branch: auto/update-ios-screenshots
          base: main
          delete-branch: true
          labels: automated

      - name: Trigger CI on PR
        if: steps.create-pr-ios.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        continue-on-error: true
        run: |
          PR_NUM="${{ steps.create-pr-ios.outputs.pull-request-number }}"
          echo "Triggering CI on PR #$PR_NUM by closing and reopening..."
          if ! gh pr close "$PR_NUM" 2>&1; then
            echo "::error::Failed to close PR #$PR_NUM via BOT_PAT — likely HTTP 401 Bad credentials (token expired/invalid). The PR was created but Battery Butler CI will NOT fire on it automatically. Workaround: 'gh pr close $PR_NUM && gh pr reopen $PR_NUM' from a session whose token is valid. Permanent fix: rotate the BOT_PAT secret in repo Settings → Secrets and variables → Actions (needs fine-grained Pull requests + Workflows read/write, or classic 'repo' + 'workflow' scopes). See the bb-16u1 task in TODO.md."
            exit 1
          fi
          gh pr reopen "$PR_NUM"
          echo "CI now triggered on PR #$PR_NUM"
