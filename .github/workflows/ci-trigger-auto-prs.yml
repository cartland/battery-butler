# =============================================================================
# CI TRIGGER FOR AUTO-GENERATED PRs
# =============================================================================
#
# PURPOSE:
#   Triggers CI on auto-generated PRs that don't get CI automatically.
#
#   The Auto-Generate Content workflow uses GITHUB_TOKEN (not BOT_PAT) to
#   create PRs. GitHub prevents GITHUB_TOKEN from triggering other workflows
#   to avoid infinite loops. This means CI never runs on those PRs.
#
#   This workflow closes and immediately reopens the PR using BOT_PAT.
#   The reopen event (from a PAT, not GITHUB_TOKEN) triggers ci.yml's
#   pull_request handler, and the resulting checks properly attach to the PR.
#
#   workflow_dispatch cannot be used here because dispatched runs don't
#   associate their check runs with PRs — the required "ci" check would
#   never appear on the PR even though CI ran on the branch.
#
#   BOT_PAT is ONLY used here for reopening — never for pushing commits.
#
# =============================================================================

name: CI for Auto PRs

on:
  workflow_run:
    workflows: ["Auto-Generate Content"]
    types: [completed]

jobs:
  trigger-ci:
    # Run on any completion — individual jobs may succeed even if others fail.
    # The script already handles missing PRs gracefully.
    runs-on: ubuntu-latest

    steps:
      - name: Trigger CI on auto-generated PRs
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const branches = [
              'auto/update-generated-content',
              'auto/update-android-screenshots',
              'auto/update-ios-screenshots'
            ];

            for (const branch of branches) {
              // Find open PR from this branch
              const { data: prs } = await github.rest.pulls.list({
                owner,
                repo,
                head: `${owner}:${branch}`,
                state: 'open'
              });

              if (prs.length === 0) {
                console.log(`No open PR found for branch ${branch}`);
                continue;
              }

              const pr = prs[0];
              console.log(`Found PR #${pr.number}: ${pr.title} (${branch})`);

              // Close and immediately reopen the PR.
              // This triggers a pull_request:reopened event from BOT_PAT,
              // which ci.yml handles natively. Unlike workflow_dispatch,
              // the resulting check runs properly attach to the PR.
              try {
                await github.rest.pulls.update({
                  owner, repo,
                  pull_number: pr.number,
                  state: 'closed'
                });
                console.log(`Closed PR #${pr.number}`);

                await github.rest.pulls.update({
                  owner, repo,
                  pull_number: pr.number,
                  state: 'open'
                });
                console.log(`Reopened PR #${pr.number} — CI should trigger`);
              } catch (error) {
                console.log(`Error on PR #${pr.number}: ${error.message}`);
              }
            }
