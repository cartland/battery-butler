# =============================================================================
# CI TRIGGER FOR AUTO-GENERATED PRs
# =============================================================================
#
# PURPOSE:
#   Triggers CI on auto-generated PRs that don't get CI automatically.
#
#   The Auto-Generate Content workflow uses GITHUB_TOKEN (not BOT_PAT) to
#   create PRs. GitHub prevents GITHUB_TOKEN from triggering other workflows
#   to avoid infinite loops. This means CI never runs on those PRs.
#
#   This workflow uses workflow_run trigger + BOT_PAT to dispatch CI after
#   the auto-generate workflow completes, ensuring auto-generated PRs get
#   proper CI status.
#
#   BOT_PAT is ONLY used here for dispatching — never for pushing commits.
#
# =============================================================================

name: CI for Auto PRs

on:
  workflow_run:
    workflows: ["Auto-Generate Content"]
    types: [completed]

jobs:
  trigger-ci:
    # Only run if the triggering workflow succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger CI on auto-generated PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const branches = [
              'auto/update-generated-content',
              'auto/update-screenshots'
            ];

            for (const branch of branches) {
              // Find open PR from this branch
              const { data: prs } = await github.rest.pulls.list({
                owner,
                repo,
                head: `${owner}:${branch}`,
                state: 'open'
              });

              if (prs.length === 0) {
                console.log(`No open PR found for branch ${branch}`);
                continue;
              }

              const pr = prs[0];
              console.log(`Found PR #${pr.number}: ${pr.title} (${branch})`);

              // Trigger the CI workflow on this PR's branch
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'ci.yml',
                  ref: branch
                });
                console.log(`Triggered CI workflow on ${branch}`);
              } catch (error) {
                // workflow_dispatch might fail if already running or branch gone
                console.log(`Note: ${error.message}`);
              }
            }
