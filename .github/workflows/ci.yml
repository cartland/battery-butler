name: Battery Butler CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  checks: write

env:
  ORG_GRADLE_PROJECT_PRODUCTION_SERVER_URL: ${{ secrets.PRODUCTION_SERVER_URL }}
  ORG_GRADLE_PROJECT_DEV_SERVER_URL: ${{ secrets.DEV_SERVER_URL }}
  ORG_GRADLE_PROJECT_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

jobs:
  # Detect if this is a documentation-only change to skip expensive builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      needs_spotless: ${{ steps.filter.outputs.needs_spotless }}
      ci_mode: ${{ steps.read_mode.outputs.ci_mode }}
    steps:
      - uses: actions/checkout@v6
      - name: Read CI mode
        id: read_mode
        run: |
          MODE=$(cat .github/ci-mode.txt 2>/dev/null | tr -d '[:space:]')
          MODE="${MODE:-release}"
          echo "ci_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "CI mode: $MODE"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/*.kt'
              - '**/*.java'
              - '**/*.swift'
              - '**/*.gradle.kts'
              - 'gradle/**'
              - 'gradlew*'
              - '**/build.gradle.kts'
              - 'settings.gradle.kts'
              - '**/*.proto'
              - 'compose-app/src/**'
              - 'compose-app/google-services.json'
              - 'compose-app/proguard-rules.pro'
              - 'domain/src/**'
              - 'usecase/src/**'
              - 'data/src/**'
              - 'data/schemas/**'
              - 'data-local/src/**'
              - 'data-local/schemas/**'
              - 'data-network/src/**'
              - 'presentation-*/src/**'
              - 'viewmodel/src/**'
              - 'fixtures/src/**'
              - 'ai/src/**'
              - 'server/app/**'
              - 'server/data/**'
              - 'server/domain/**'
              - 'server/terraform/**'
              - 'server/build/**'
              - 'server/build.gradle.kts'
              - 'ios-app-*/**'
              - 'android-screenshot-tests/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.github/actions/**'
            docs_only:
              - '**/*.md'
              - '**/*.mmd'
              - '.beads/**'
              - '.agent/**'
              - '.claude/**'
              - 'CLAUDE.md'
              - 'LICENSE'
              - '.gitignore'
              - '.gitattributes'
            # Files that need spotless (code + markdown)
            needs_spotless:
              - '**/*.kt'
              - '**/*.java'
              - '**/*.md'
              - '**/*.gradle.kts'

  validation_spotless:
    needs: changes
    if: needs.changes.outputs.needs_spotless == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Clean Project
        run: echo "Skipping clean to use cache (if available) and speed up build"
      - name: Check Formatting (Spotless)
        run: ./gradlew spotlessCheck --stacktrace

  validation_lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Run Lint
        run: ./gradlew lint --stacktrace

  validation_detekt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Run Detekt
        run: ./gradlew detekt detektAndroidMain --stacktrace

  validation_test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

  validation_compile_tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Compile All Test Sources
        run: ./gradlew compileTestKotlin --stacktrace

  validation_instrumented:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Instrumented Tests
        run: ./scripts/test.sh

  validation_ios_ui:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin Xcode version for reproducible iOS snapshots.
          # Update this when changing local dev Xcode version.
          xcode-version: '26.3'
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ios-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ios-
            ${{ runner.os }}-gradle-
      - name: Cache Bazel
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ runner.os }}-bazel-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'protos/**') }}
          restore-keys: |
            ${{ runner.os }}-bazel-
      - name: Verify iOS App (SwiftUI) Compilation
        run: |
          cd ios-app-swift-ui
          xcodebuild -project iosAppSwiftUI.xcodeproj -configuration Debug -scheme iosAppSwiftUI -destination 'generic/platform=iOS Simulator' clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Build Experimental iOS App
        run: |
          xcodebuild -project experimental/ios-app/ExperimentalApp.xcodeproj -configuration Debug -scheme ExperimentalApp -destination 'generic/platform=iOS Simulator' clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build/ios-experimental/
      - name: Build iOS Snapshot Tests
        run: |
          cd ios-app-swift-ui
          xcodebuild build-for-testing \
            -project iosAppSwiftUI.xcodeproj \
            -scheme iosAppSwiftUITests \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-tests \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  validation_theme_layer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Check Theme Layer Enforcement
        run: ./gradlew checkThemeLayer

  validation_test_coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Check Test Coverage
        run: ./gradlew checkTestCoverage

  validation_naming_convention:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Check Naming Conventions
        run: ./gradlew checkNamingConventions

  validation_hardcoded_strings:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Check Hardcoded Strings
        run: ./gradlew checkHardcodedStrings

  validation_architecture:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Check Architecture
        run: ./gradlew checkArchitecture

  validation_import_boundary:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Check Import Boundaries
        run: ./gradlew checkImportBoundary

  build_android:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Build Android App
        run: ./gradlew :compose-app:assembleDebug
      - name: Build Experimental Android App
        run: ./gradlew :experimental:compose-app:assembleDebug
      - name: Upload Android APKs and AABs
        uses: actions/upload-artifact@v7
        with:
          name: battery-butler-android-builds
          path: |
            compose-app/build/outputs/**/*.apk
            compose-app/build/outputs/**/*.aab
          retention-days: 90

  build_ios_compose:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin Xcode version for reproducible iOS snapshots.
          # Update this when changing local dev Xcode version.
          xcode-version: '26.3'

      - name: Checkout
        uses: actions/checkout@v6

      # Gradle caching for KMP framework build
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ios-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ios-
            ${{ runner.os }}-gradle-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-compose-${{ hashFiles('ios-app-compose-ui/**/*.swift', 'ios-app-compose-ui/**/*.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-compose-

      - name: Build iOS App (Compose UI)
        run: |
          xcodebuild -project ios-app-compose-ui/iosAppComposeUI.xcodeproj -configuration Debug -scheme iosAppComposeUI -destination 'generic/platform=iOS Simulator' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build/ios-compose/

      - name: Upload iOS App (Compose UI)
        uses: actions/upload-artifact@v7
        with:
          name: battery-butler-ios-compose-app
          path: ios-app-compose-ui/build/
          retention-days: 90

  build_ios_native:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin Xcode version for reproducible iOS snapshots.
          # Update this when changing local dev Xcode version.
          xcode-version: '26.3'

      - name: Checkout
        uses: actions/checkout@v6

      # Gradle caching for KMP framework build
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ios-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ios-
            ${{ runner.os }}-gradle-

      # Bazel caching for proto generation
      - name: Cache Bazel
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ runner.os }}-bazel-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'protos/**') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-native-${{ hashFiles('ios-app-swift-ui/**/*.swift', 'ios-app-swift-ui/**/*.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-native-

      - name: Build iOS App (SwiftUI)
        run: |
          cd ios-app-swift-ui
          xcodebuild -project iosAppSwiftUI.xcodeproj -configuration Debug -scheme iosAppSwiftUI -destination 'generic/platform=iOS Simulator' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build/

      - name: Upload iOS App (SwiftUI)
        uses: actions/upload-artifact@v7
        with:
          name: battery-butler-ios-swiftui-app
          path: ios-app-swift-ui/build/
          retention-days: 90

  build_desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Build Desktop App
        run: ./gradlew :compose-app:packageDistributionForCurrentOS
      - name: Upload Desktop Binaries
        uses: actions/upload-artifact@v7
        with:
          name: battery-butler-desktop-dist-${{ matrix.os }}
          path: compose-app/build/compose/binaries
          retention-days: 90
          compression-level: 0

  build_server:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Build Server
        run: ./gradlew :server:app:build
      - name: Verify Jib Container Build
        # Build container as tar to catch Jib/dependency issues early
        # This doesn't require Docker but validates the container build pipeline
        run: ./gradlew :server:app:jibBuildTar
      - name: Upload Server JAR
        uses: actions/upload-artifact@v7
        with:
          name: battery-butler-server-jar
          path: server/app/build/libs/
          retention-days: 90

  # Non-blocking check: warn if generated content (diagrams, analysis) is out of date
  # This does NOT block PRs — it's informational only. The auto-generate workflow
  # updates generated content post-merge on main via follow-up PRs.
  check_generated_content:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java-gradle
      - name: Generate diagrams and analysis
        run: ./gradlew generateMermaidGraph analyzeCode
      - name: Check for drift
        run: |
          if git diff --quiet docs/diagrams/ docs/CODE_ANALYSIS.md; then
            echo "Generated content is up to date"
          else
            echo "::warning::Generated content (diagrams/analysis) would change with this PR."
            echo "::warning::This is informational only — content will be updated automatically"
            echo "::warning::after merge via the Auto-Generate Content workflow."
            echo ""
            echo "Files that would change:"
            git diff --name-only docs/diagrams/ docs/CODE_ANALYSIS.md
          fi

  # Single required status check that works with path filtering
  # This job passes if all required jobs passed OR were skipped (docs-only changes)
  # In development mode on PRs, slow jobs are expected to be skipped
  ci:
    needs:
      - changes
      - validation_spotless
      - validation_lint
      - validation_detekt
      - validation_test
      - validation_compile_tests
      - validation_instrumented
      - validation_ios_ui
      - validation_theme_layer
      - validation_test_coverage
      - validation_naming_convention
      - validation_hardcoded_strings
      - validation_architecture
      - validation_import_boundary
      - build_android
      - build_ios_compose
      - build_ios_native
      - build_desktop
      - build_server
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CI Status
        env:
          CI_MODE: ${{ needs.changes.outputs.ci_mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Determine if slow jobs should be checked
          # In development mode on PRs, slow jobs are intentionally skipped
          CHECK_SLOW=true
          if [[ "$EVENT_NAME" != "push" && "$CI_MODE" == "development" ]]; then
            CHECK_SLOW=false
            echo "Development mode (PR): only checking fast jobs"
          fi

          # Always check fast jobs (failure or cancelled = fail)
          FAILED=false
          echo "Checking fast jobs..."
          for result in \
            "${{ needs.validation_spotless.result }}" \
            "${{ needs.validation_lint.result }}" \
            "${{ needs.validation_detekt.result }}" \
            "${{ needs.validation_test.result }}" \
            "${{ needs.validation_compile_tests.result }}" \
            "${{ needs.validation_theme_layer.result }}" \
            "${{ needs.validation_test_coverage.result }}" \
            "${{ needs.validation_naming_convention.result }}" \
            "${{ needs.validation_hardcoded_strings.result }}" \
            "${{ needs.validation_architecture.result }}" \
            "${{ needs.validation_import_boundary.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              FAILED=true
            fi
          done

          # Check slow jobs only in release mode or on push to main
          if [[ "$CHECK_SLOW" == "true" ]]; then
            echo "Checking slow jobs..."
            for result in \
              "${{ needs.validation_instrumented.result }}" \
              "${{ needs.validation_ios_ui.result }}" \
              "${{ needs.build_android.result }}" \
              "${{ needs.build_ios_compose.result }}" \
              "${{ needs.build_ios_native.result }}" \
              "${{ needs.build_desktop.result }}" \
              "${{ needs.build_server.result }}"; do
              if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
                FAILED=true
              fi
            done
          else
            echo "Slow jobs skipped (development mode on PR) — will run post-merge on main"
          fi

          if [[ "$FAILED" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "All required jobs passed or were skipped"
