name: Battery Butler CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ci_mode:
        description: 'CI mode override — "release" runs the full suite (iOS/instrumented/server/build_*) on demand; "development" skips the slow jobs.'
        type: choice
        options:
          - development
          - release
        default: development

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  checks: write

env:
  ORG_GRADLE_PROJECT_PRODUCTION_SERVER_URL: ${{ secrets.PRODUCTION_SERVER_URL }}
  ORG_GRADLE_PROJECT_DEV_SERVER_URL: ${{ secrets.DEV_SERVER_URL }}
  ORG_GRADLE_PROJECT_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

jobs:
  # Detect if this is a documentation-only change to skip expensive builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      # workflow_dispatch has no diff to path-filter, so treat a manual run as a code change.
      # This lets `gh workflow run "Battery Butler CI" --ref main -f ci_mode=release` force the
      # full suite (incl. build_ios_native / validation_ios_ui) on demand (bb-cidsp).
      code: ${{ steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch' }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      needs_spotless: ${{ steps.filter.outputs.needs_spotless }}
      ci_mode: ${{ steps.read_mode.outputs.ci_mode }}
      # True when a PR touches dependency/build wiring. Those changes break the jobs
      # development mode skips on PRs, so the sentinels run for them regardless of mode.
      # See "Risky-change escalation" in .agent/ci.md.
      risky: ${{ steps.filter.outputs.risky }}
    steps:
      - uses: actions/checkout@v7
      - name: Read CI mode
        id: read_mode
        run: |
          # A workflow_dispatch input overrides the committed ci-mode.txt (bb-cidsp).
          MODE="${{ github.event.inputs.ci_mode }}"
          if [ -z "$MODE" ]; then
            MODE=$(cat .github/ci-mode.txt 2>/dev/null | tr -d '[:space:]')
          fi
          MODE="${MODE:-release}"
          echo "ci_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "CI mode: $MODE"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**/*.kt'
              - '**/*.java'
              - '**/*.swift'
              - '**/*.gradle.kts'
              - 'gradle/**'
              - 'gradlew*'
              - '**/build.gradle.kts'
              - 'settings.gradle.kts'
              - '**/*.proto'
              - 'compose-app/src/**'
              - 'compose-app/google-services.json'
              - 'compose-app/proguard-rules.pro'
              - 'domain/src/**'
              - 'usecase/src/**'
              - 'data/src/**'
              - 'data/schemas/**'
              - 'data-local/src/**'
              - 'data-local/schemas/**'
              - 'data-network/src/**'
              - 'presentation-*/src/**'
              - 'viewmodel/src/**'
              - 'fixtures/src/**'
              - 'ai/src/**'
              - 'server/app/**'
              - 'server/data/**'
              - 'server/domain/**'
              - 'server/terraform/**'
              - 'server/build/**'
              - 'server/build.gradle.kts'
              - 'ios-app-*/**'
              - 'android-screenshot-tests/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.github/actions/**'
            docs_only:
              - '**/*.md'
              - '**/*.mmd'
              - '.agent/**'
              - '.claude/**'
              - 'CLAUDE.md'
              - 'LICENSE'
              - '.gitignore'
              - '.gitattributes'
            # Dependency / build wiring. A change here can break Android, iOS, desktop or
            # server in ways the fast PR checks cannot see, because development mode skips
            # those jobs on PRs. Every dependency break on main traced back to a file in
            # this list, so these PRs get the full sentinel set even in development mode.
            risky:
              - 'gradle/libs.versions.toml'
              - 'gradle/**'
              - 'gradlew*'
              - '**/build.gradle.kts'
              - 'settings.gradle.kts'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'buildSrc/**'
              # Types Kotlin/Native exports to Swift. Adding a parameter to one of these is
              # source-compatible for Kotlin and a COMPILE ERROR for every Swift call site --
              # K/N emits one initializer taking all parameters and Kotlin defaults do not
              # cross the boundary. Swift constructs these directly (TestData.swift builds
              # Device/DeviceType/BatteryEvent; the *ScreenTests build the screen states), so
              # the Swift test target is the thing that catches it. Escalating here makes
              # validation_ios_ui -- which dev mode would otherwise skip on PRs -- run on
              # exactly the changes that can break it, instead of finding out post-merge.
              - 'domain/**'
              - 'presentation-model/**'
            # Files that need spotless (code + markdown)
            needs_spotless:
              - '**/*.kt'
              - '**/*.java'
              - '**/*.md'
              - '**/*.gradle.kts'

  # On PRs, fail if there is any open issue tagged "ci-failure" + "blocking".
  # These are filed by .github/workflows/ci-post-merge-issue.yml when CI fails
  # on a push to main. While one is open, new auto-merges are paused so we
  # fix-forward instead of piling on top of broken main. The issue auto-closes
  # on the next green push-to-main CI run.
  #
  # ESCAPE HATCH: a PR labelled `ci-fix` skips this gate. Without it the gate
  # deadlocks -- while a blocking issue is open nothing can merge, so no push to
  # main happens, so no green push-to-main run exists to auto-close the issue, so
  # nothing can merge. Hit for real on issue #1429 (2026-07-30), which had to be
  # closed by hand. Label the fix-forward PR `ci-fix` to break the cycle.
  validation_no_blocking_issues:
    needs: changes
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci-fix')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    steps:
      - name: Check for blocking ci-failure issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BLOCKING_ISSUES=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label ci-failure \
            --label blocking \
            --state open \
            --json number,title,url \
            --jq '.')

          COUNT=$(echo "$BLOCKING_ISSUES" | jq 'length')
          if [[ "$COUNT" -gt 0 ]]; then
            echo "::error::$COUNT blocking ci-failure issue(s) open on main. Fix forward before merging new PRs."
            echo "$BLOCKING_ISSUES" | jq -r '.[] | "  - #\(.number) \(.title) — \(.url)"'
            exit 1
          fi
          echo "No blocking ci-failure issues. PR allowed to proceed."

  validation_spotless:
    needs: changes
    if: needs.changes.outputs.needs_spotless == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Clean Project
        run: echo "Skipping clean to use cache (if available) and speed up build"
      - name: Check Formatting (Spotless)
        run: ./gradlew spotlessCheck --stacktrace

  validation_lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Run Lint
        run: ./gradlew lint --stacktrace

  validation_detekt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Run Detekt
        run: ./gradlew detekt detektAndroidMain --stacktrace

  validation_test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      # `test` above only exists in projects with the JVM/Android plugin. KMP modules
      # expose desktopTest / jvmTest instead, and `./gradlew test` schedules NEITHER --
      # verified with `./gradlew test --dry-run`, which lists no desktopTest or jvmTest
      # task in any project. That silently excluded ~796 tests across 13 modules
      # (usecase, viewmodel, domain, data, data-network, data-local, presentation-*,
      # ai, and the experimental/* mirrors) from every CI run.
      #
      # Both task names are needed: modules disagree on whether the JVM target is called
      # `desktop` or `jvm`. Gradle only errors if NO project has a given task, and at
      # least one project has each, so naming both is safe.
      - name: Run KMP Unit Tests
        run: ./gradlew desktopTest jvmTest --stacktrace

      # buildSrc is a separate build -- the root `test` above does not descend into it, so
      # its tests need their own invocation. Without this they never run in CI at all.
      - name: Run buildSrc Unit Tests
        run: ./gradlew -p buildSrc test --stacktrace

  validation_compile_tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Compile All Test Sources
        run: ./gradlew compileTestKotlin --stacktrace

  validation_instrumented:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development' || needs.changes.outputs.risky == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Instrumented Tests
        run: ./scripts/test.sh

  validation_ios_ui:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development' || needs.changes.outputs.risky == 'true')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin Xcode version for reproducible iOS snapshots.
          # Update this when changing local dev Xcode version.
          xcode-version: '26.3'
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ios-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ios-
            ${{ runner.os }}-gradle-
      - name: Cache Bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ runner.os }}-bazel-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'protos/**') }}
          restore-keys: |
            ${{ runner.os }}-bazel-
      - name: Verify iOS App (SwiftUI) Compilation
        run: |
          cd ios-app-swift-ui
          xcodebuild -project iosAppSwiftUI.xcodeproj -configuration Debug -scheme iosAppSwiftUI -destination 'generic/platform=iOS Simulator' clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Build Experimental iOS App
        run: |
          xcodebuild -project experimental/ios-app/ExperimentalApp.xcodeproj -configuration Debug -scheme ExperimentalApp -destination 'generic/platform=iOS Simulator' clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build/ios-experimental/
      - name: Build iOS Snapshot Tests
        run: |
          cd ios-app-swift-ui
          xcodebuild build-for-testing \
            -project iosAppSwiftUI.xcodeproj \
            -scheme iosAppSwiftUITests \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-tests \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  validation_theme_layer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Check Theme Layer Enforcement
        run: ./gradlew checkThemeLayer

  validation_test_coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Check Test Coverage
        run: ./gradlew checkTestCoverage

  validation_naming_convention:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Check Naming Conventions
        run: ./gradlew checkNamingConventions

  validation_hardcoded_strings:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Check Hardcoded Strings
        run: ./gradlew checkHardcodedStrings

  validation_architecture:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Check Architecture
        run: ./gradlew checkArchitecture checkPreviewTime

  validation_import_boundary:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Check Import Boundaries
        run: ./gradlew checkImportBoundary

  build_android:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development' || needs.changes.outputs.risky == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Build Android App
        run: ./gradlew :compose-app:assembleDebug
      - name: Build Experimental Android App
        run: ./gradlew :experimental:compose-app:assembleDebug
      - name: Upload Android APKs and AABs
        uses: actions/upload-artifact@v7
        with:
          name: battery-butler-android-builds
          path: |
            compose-app/build/outputs/**/*.apk
            compose-app/build/outputs/**/*.aab
          retention-days: 90

  build_ios_compose:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development' || needs.changes.outputs.risky == 'true')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin Xcode version for reproducible iOS snapshots.
          # Update this when changing local dev Xcode version.
          xcode-version: '26.3'

      - name: Checkout
        uses: actions/checkout@v7

      # Gradle caching for KMP framework build
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ios-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ios-
            ${{ runner.os }}-gradle-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-compose-${{ hashFiles('ios-app-compose-ui/**/*.swift', 'ios-app-compose-ui/**/*.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-compose-

      # Kotlin/Native is stricter than the JVM about declaration names -- it rejects `,`
      # and `()` inside backticked identifiers. commonTest code that compiles fine for
      # desktop and Android can therefore fail only for the iOS targets, and nothing else
      # in CI compiles K/N test sources: validation_compile_tests runs `compileTestKotlin`,
      # which matches only the exactly-named task and never the target-suffixed KMP
      # variants, and the iOS builds below compile main sources, not test sources.
      # 14 such breakages accumulated undetected before PR #1438 fixed them.
      #
      # This runs here rather than in a new macOS job because Apple targets need a macOS
      # runner and this one is already warm with the Gradle/KMP cache.
      - name: Compile Kotlin/Native Test Sources
        run: ./gradlew compileTestKotlinIosSimulatorArm64 --stacktrace

      - name: Build iOS App (Compose UI)
        run: |
          xcodebuild -project ios-app-compose-ui/iosAppComposeUI.xcodeproj -configuration Debug -scheme iosAppComposeUI -destination 'generic/platform=iOS Simulator' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build/ios-compose/

      - name: Upload iOS App (Compose UI)
        uses: actions/upload-artifact@v7
        with:
          name: battery-butler-ios-compose-app
          path: ios-app-compose-ui/build/
          retention-days: 90

  build_ios_native:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development' || needs.changes.outputs.risky == 'true')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin Xcode version for reproducible iOS snapshots.
          # Update this when changing local dev Xcode version.
          xcode-version: '26.3'

      - name: Checkout
        uses: actions/checkout@v7

      # Gradle caching for KMP framework build
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ios-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ios-
            ${{ runner.os }}-gradle-

      # Bazel caching for proto generation
      - name: Cache Bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ runner.os }}-bazel-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'protos/**') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      # Build into a local -derivedDataPath and do NOT set CONFIGURATION_BUILD_DIR. Overriding
      # CONFIGURATION_BUILD_DIR makes SwiftPM package products land in a flat dir that the app's
      # swiftc doesn't search, so the build fails with "Unable to find module dependency:
      # 'KMPObservableViewModelCore'" (the KMP-ObservableViewModel SPM package added in #1250).
      # Only iosAppSwiftUI consumes an SPM package, which is why the other iOS apps build fine
      # WITH CONFIGURATION_BUILD_DIR. The passing validation_ios_ui job and ./scripts/build-ios.sh
      # both avoid it. Reproduced + fixed locally before merge. (Earlier #1260/#1265 mis-blamed the
      # DerivedData cache; the real cause was CONFIGURATION_BUILD_DIR — see bb-iosv.)
      - name: Build iOS App (SwiftUI)
        run: |
          cd ios-app-swift-ui
          xcodebuild -project iosAppSwiftUI.xcodeproj -configuration Debug -scheme iosAppSwiftUI -destination 'generic/platform=iOS Simulator' clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath build/ios-build

      - name: Upload iOS App (SwiftUI)
        uses: actions/upload-artifact@v7
        with:
          name: battery-butler-ios-swiftui-app
          path: ios-app-swift-ui/build/ios-build/Build/Products/Debug-iphonesimulator/
          retention-days: 90

  build_desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development' || needs.changes.outputs.risky == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Build Desktop App
        run: ./gradlew :compose-app:packageDistributionForCurrentOS
      - name: Upload Desktop Binaries
        uses: actions/upload-artifact@v7
        with:
          name: battery-butler-desktop-dist-${{ matrix.os }}
          path: compose-app/build/compose/binaries
          retention-days: 90
          compression-level: 0

  build_server:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.ci_mode != 'development' || needs.changes.outputs.risky == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Build Server
        run: ./gradlew :server:app:build
      - name: Verify Jib Container Build
        # Build container as tar to catch Jib/dependency issues early
        # This doesn't require Docker but validates the container build pipeline
        run: ./gradlew :server:app:jibBuildTar
      - name: Upload Server JAR
        uses: actions/upload-artifact@v7
        with:
          name: battery-butler-server-jar
          path: server/app/build/libs/
          retention-days: 90

  # Non-blocking check: warn if generated content (diagrams, analysis) is out of date
  # This does NOT block PRs — it's informational only. The auto-generate workflow
  # updates generated content post-merge on main via follow-up PRs.
  check_generated_content:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle
      - name: Generate diagrams and analysis
        run: ./gradlew generateMermaidGraph analyzeCode
      - name: Check for drift
        run: |
          if git diff --quiet docs/diagrams/ docs/CODE_ANALYSIS.md; then
            echo "Generated content is up to date"
          else
            echo "::warning::Generated content (diagrams/analysis) would change with this PR."
            echo "::warning::This is informational only — content will be updated automatically"
            echo "::warning::after merge via the Auto-Generate Content workflow."
            echo ""
            echo "Files that would change:"
            git diff --name-only docs/diagrams/ docs/CODE_ANALYSIS.md
          fi

  # Single required status check that works with path filtering
  # This job passes if all required jobs passed OR were skipped (docs-only changes)
  # In development mode on PRs, slow jobs are expected to be skipped
  ci:
    needs:
      - changes
      - validation_no_blocking_issues
      - validation_spotless
      - validation_lint
      - validation_detekt
      - validation_test
      - validation_compile_tests
      - validation_instrumented
      - validation_ios_ui
      - validation_theme_layer
      - validation_test_coverage
      - validation_naming_convention
      - validation_hardcoded_strings
      - validation_architecture
      - validation_import_boundary
      - build_android
      - build_ios_compose
      - build_ios_native
      - build_desktop
      - build_server
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CI Status
        env:
          CI_MODE: ${{ needs.changes.outputs.ci_mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Determine if slow jobs should be checked
          # In development mode on PRs, slow jobs are intentionally skipped
          CHECK_SLOW=true
          if [[ "$EVENT_NAME" != "push" && "$CI_MODE" == "development" ]]; then
            CHECK_SLOW=false
            echo "Development mode (PR): only checking fast jobs"
          fi

          # Always check fast jobs (failure or cancelled = fail)
          FAILED=false
          echo "Checking fast jobs..."
          for result in \
            "${{ needs.validation_no_blocking_issues.result }}" \
            "${{ needs.validation_spotless.result }}" \
            "${{ needs.validation_lint.result }}" \
            "${{ needs.validation_detekt.result }}" \
            "${{ needs.validation_test.result }}" \
            "${{ needs.validation_compile_tests.result }}" \
            "${{ needs.validation_theme_layer.result }}" \
            "${{ needs.validation_test_coverage.result }}" \
            "${{ needs.validation_naming_convention.result }}" \
            "${{ needs.validation_hardcoded_strings.result }}" \
            "${{ needs.validation_architecture.result }}" \
            "${{ needs.validation_import_boundary.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              FAILED=true
            fi
          done

          # Check slow jobs only in release mode or on push to main
          if [[ "$CHECK_SLOW" == "true" ]]; then
            echo "Checking slow jobs..."
            for result in \
              "${{ needs.validation_instrumented.result }}" \
              "${{ needs.validation_ios_ui.result }}" \
              "${{ needs.build_android.result }}" \
              "${{ needs.build_ios_compose.result }}" \
              "${{ needs.build_ios_native.result }}" \
              "${{ needs.build_desktop.result }}" \
              "${{ needs.build_server.result }}"; do
              if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
                FAILED=true
              fi
            done
          else
            echo "Slow jobs skipped (development mode on PR) — will run post-merge on main"
          fi

          if [[ "$FAILED" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "All required jobs passed or were skipped"
