name: Release Android to Play Store

# Triggers:
# 1. Push a tag: git tag android/123 && git push origin android/123
# 2. Manual retry: Actions → Run workflow → select existing android/N tag
on:
  workflow_dispatch:
  push:
    tags:
      - 'android/[0-9]*'

# Safety limit to prevent accidentally exhausting version codes.
# Change this value if you need higher version codes.
# Google Play hard limit is 2,100,000,000.
env:
  VERSION_CODE_SAFETY_LIMIT: 1000000
  ORG_GRADLE_PROJECT_PRODUCTION_SERVER_URL: ${{ secrets.PRODUCTION_SERVER_URL }}
  ORG_GRADLE_PROJECT_DEV_SERVER_URL: ${{ secrets.DEV_SERVER_URL }}
  # Labs backend config. All PUBLIC values (shipped in the client): per-env URL, Firebase Web API
  # key, and OAuth Web client ID. Stored as repository Variables (Settings → Secrets and variables →
  # Actions → Variables), not Secrets, because they are not confidential. When LABS_PROD_URL is set,
  # a fresh install defaults to Labs prod (DataStoreNetworkModeRepository.defaultNetworkMode); unset
  # → the build safely defaults offline. The OAuth client *secret* is intentionally omitted: Android
  # Credential Manager authenticates by server client ID only and ignores it.
  ORG_GRADLE_PROJECT_LABS_STAGING_URL: ${{ vars.LABS_STAGING_URL }}
  ORG_GRADLE_PROJECT_LABS_PROD_URL: ${{ vars.LABS_PROD_URL }}
  ORG_GRADLE_PROJECT_LABS_STAGING_FIREBASE_API_KEY: ${{ vars.LABS_STAGING_FIREBASE_API_KEY }}
  ORG_GRADLE_PROJECT_LABS_PROD_FIREBASE_API_KEY: ${{ vars.LABS_PROD_FIREBASE_API_KEY }}
  ORG_GRADLE_PROJECT_LABS_STAGING_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.LABS_STAGING_GOOGLE_OAUTH_CLIENT_ID }}
  ORG_GRADLE_PROJECT_LABS_PROD_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.LABS_PROD_GOOGLE_OAUTH_CLIENT_ID }}

permissions:
  contents: read

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get tagged commit SHA
        id: get-sha
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SHA=$(gh api repos/${{ github.repository }}/git/ref/tags/${TAG} --jq '.object.sha' 2>/dev/null || echo "")
          if [ -z "$SHA" ]; then
            # Lightweight tag - SHA is in the ref itself
            SHA=$(gh api repos/${{ github.repository }}/git/ref/tags/${TAG} --jq '.object.sha')
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Tagged commit: $SHA"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify CI passed on tagged commit
        run: |
          TAG_SHA="${{ steps.get-sha.outputs.sha }}"
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Checking CI status for commit $TAG_SHA (tag $TAG)..."

          # The 'ci' aggregator alone is INSUFFICIENT as a release gate.
          # Two failure modes produce a false-green 'ci':
          #   1. Path-filter (dorny/paths-filter) skips all real
          #      validation_* and build_* jobs on docs-only commits, but
          #      'ci' still aggregates to success because nothing ran.
          #   2. Dev-mode CI (`.github/ci-mode.txt = development`) plus a
          #      non-push event (workflow_dispatch, pull_request) skips
          #      slow jobs per ci.yml's
          #      `github.event_name == 'push' || ci_mode != 'development'`
          #      condition — same false-green path.
          #
          # Both look identical from the check_runs API: real jobs report
          # conclusion="skipped" while 'ci' reports "success". Fetching the
          # whole check-runs list and verifying a SENTINEL SET of real jobs
          # is the only way to tell the difference.
          #
          # See the sentinel-set rationale in .agent/ci.md.

          SENTINEL_JOBS=(
            "validation_ios_ui"
            "validation_instrumented"
            "build_android"
            "build_ios_compose"
            "build_ios_native"
            "build_server"
          )

          # Paginate and flatten all check_runs across pages into one array.
          CHECK_RUNS=$(gh api --paginate \
            "repos/${{ github.repository }}/commits/$TAG_SHA/check-runs?per_page=100" \
            --jq '.check_runs[]' | jq -s '.')

          # Also keep the legacy 'ci' aggregator check — if it failed,
          # the sentinel set probably also did, but a clear message helps.
          #
          # NOTE on `sort_by(.completed_at) | last`: the GitHub check_runs
          # API returns runs in DESCENDING `started_at` order by default,
          # so the original code's bare `| last` was picking the OLDEST
          # run (often a skipped path-filtered run on the same SHA),
          # masking the actual latest rerun result. We explicitly filter
          # to completed runs and pick the most recent by completed_at.
          CI_CONCLUSION=$(echo "$CHECK_RUNS" | jq -r '
            [.[] | select(.name == "ci") | select(.status == "completed")]
              | sort_by(.completed_at) | last | .conclusion // "no_completed_run"
          ')
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "::error::'ci' aggregator on $TAG_SHA concluded '$CI_CONCLUSION', expected 'success'"
            exit 1
          fi

          FAILED=0
          for JOB in "${SENTINEL_JOBS[@]}"; do
            # Take the LATEST COMPLETED check_run with this name. See the
            # NOTE above about API ordering — bare `| last` is buggy.
            CONCLUSION=$(echo "$CHECK_RUNS" | jq -r --arg job "$JOB" '
              [.[] | select(.name == $job) | select(.status == "completed")]
                | sort_by(.completed_at) | last | .conclusion // "no_completed_run"
            ')
            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::sentinel job '$JOB' on $TAG_SHA: conclusion='$CONCLUSION' (expected 'success')"
              FAILED=1
            else
              echo "  ✓ $JOB: success"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::"
            echo "::error::One or more sentinel jobs were not run with conclusion=success on $TAG_SHA."
            echo "::error::Either the tagged commit was path-filter-skipped (docs-only) or its CI"
            echo "::error::ran in development mode without slow jobs. Tag rejected."
            echo "::error::"
            echo "::error::Recovery: ensure .github/ci-mode.txt = 'release' on main, then run"
            echo "::error::  gh workflow run \"Battery Butler CI\" --ref main"
            echo "::error::Wait for it to complete with all sentinel jobs success, then re-run this"
            echo "::error::release workflow (Actions → Run workflow → select tag $TAG)."
            exit 1
          fi

          echo "All sentinel jobs passed on $TAG_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate tag format
        id: validate
        run: |
          REF="${GITHUB_REF}"
          echo "Ref: $REF"

          # Must be a tag
          if [[ ! "$REF" =~ ^refs/tags/ ]]; then
            echo "::error::This workflow must be run on a tag."
            echo "::error::"
            echo "::error::For manual dispatch, select an existing 'android/N' tag from the branch/tag dropdown."
            echo "::error::Do not run on a branch."
            exit 1
          fi

          TAG="${REF#refs/tags/}"

          # Must match android/N pattern
          if [[ ! "$TAG" =~ ^android/[0-9]+$ ]]; then
            echo "::error::Tag must match 'android/N' pattern, got: $TAG"
            exit 1
          fi

          VERSION="${TAG#android/}"

          # Check minimum
          if [ "$VERSION" -lt 1 ]; then
            echo "::error::versionCode must be at least 1, got: $VERSION"
            exit 1
          fi

          # Check against safety limit (configurable at top of workflow)
          if [ "$VERSION" -gt "$VERSION_CODE_SAFETY_LIMIT" ]; then
            echo "::error::versionCode $VERSION exceeds safety limit of $VERSION_CODE_SAFETY_LIMIT."
            echo "::error::"
            echo "::error::This limit exists to prevent accidentally exhausting version codes."
            echo "::error::To increase the limit, edit VERSION_CODE_SAFETY_LIMIT in .github/workflows/release-android.yml"
            echo "::error::"
            echo "::error::WARNING: Google Play has a hard limit of 2,100,000,000. Once you reach it,"
            echo "::error::you cannot upload new versions of your app."
            exit 1
          fi

          echo "version_code=$VERSION" >> $GITHUB_OUTPUT
          echo "Validated: tag=$TAG, versionCode=$VERSION (limit: $VERSION_CODE_SAFETY_LIMIT)"

      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-java-gradle

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Write API keys to local.properties
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Build Release Bundle
        run: |
          ./gradlew :compose-app:bundleRelease --stacktrace \
            -PVERSION_CODE=${{ steps.validate.outputs.version_code }} \
            -PKEYSTORE_PATH=${{ github.workspace }}/release.keystore \
            -PKEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PKEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            -PKEY_PASSWORD=${{ secrets.KEY_PASSWORD }}

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: compose-app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Validate Server Connectivity
        continue-on-error: true
        run: |
          SERVER_URL="${{ secrets.PRODUCTION_SERVER_URL }}"
          if [ -z "$SERVER_URL" ]; then
            echo "::warning::PRODUCTION_SERVER_URL secret is not set"
            exit 1
          fi
          HOST_PORT=$(echo "$SERVER_URL" | sed 's|http://||' | sed 's|/$||')
          if ! timeout 10 bash -c "echo > /dev/tcp/${HOST_PORT%:*}/${HOST_PORT#*:}" 2>/dev/null; then
            echo "::warning::Cannot reach server at $SERVER_URL"
            echo "::warning::The NLB hostname may be stale. Check ./scripts/deploy-status.sh"
            exit 1
          fi
          echo "Server reachable at $SERVER_URL"

      - name: Upload to Play Store (Internal Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.chriscartland.batterybutler
          releaseFiles: compose-app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          whatsNewDirectory: distribution/android/play-store/whatsnew

      - name: Cleanup Keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.keystore
